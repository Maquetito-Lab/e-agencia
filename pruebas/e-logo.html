<script>
(() => { // la bajada que se tipea (igual que en e.html)
  const tag = document.querySelector('.top__tag'), txt = document.querySelector('.top__txt'), frases = tag.dataset.frases.split('|');
  let f = 0, i = 0, del = false;
  const tick = () => { const s = frases[f];
    if (!del) { i++; txt.textContent = s.slice(0, i); if (i === s.length) { del = true; return setTimeout(tick, 2200); } return setTimeout(tick, 55 + Math.random() * 60); }
    i--; txt.textContent = s.slice(0, i); if (i === 0) { del = false; f = (f + 1) % frases.length; return setTimeout(tick, 500); } setTimeout(tick, 28); };
  setTimeout(tick, 600);
})();

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const host = document.querySelector('.top__3d');
const U = 1 / 300, CX = 262, CY = 301;                 // la e vive en 524×602 (centro 262,301); 300 px = 1 unidad
const v = (x, y, z = 0) => new THREE.Vector3((x - CX) * U, -(y - CY) * U, z);
const P = [[118,415],[180,330],[280,205],[350,135],[405,80],[365,12],[250,20],[130,35],[40,140],[28,260],[18,380],[40,500],[120,565],[210,600],[330,520],[430,420],[470,380],[495,345],[502,328]];
const makePath = () => { const path = new THREE.CurvePath(); for (let i = 0; i + 3 < P.length; i += 3) path.add(new THREE.CubicBezierCurve3(v(...P[i]), v(...P[i + 1]), v(...P[i + 2]), v(...P[i + 3]))); return path; };
const path = makePath(), R = 67.5 * U, DOT = v(706, 491); // DOT: dónde va el punto en el logo (relativo al centro de la e)
const ROJO = 0xe30613;

/* ---------- escena compartida ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(28, 1, .1, 50);
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffe0e6, .6); fill.position.set(-3, -1, 2); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, .35));
const gloss = () => new THREE.MeshPhysicalMaterial({ color: ROJO, roughness: .26, metalness: .05, clearcoat: 1, clearcoatRoughness: .12, envMapIntensity: .9 });
const matte = () => new THREE.MeshStandardMaterial({ color: ROJO, roughness: .78, metalness: 0, envMapIntensity: .35 });
const tube = (mat, seg = 260, rad = R) => new THREE.Mesh(new THREE.TubeGeometry(path, seg, rad, 36, false), mat);
const caps = (mat, rad = R) => [P[0], P[P.length - 1]].map(([x, y]) => { const c = new THREE.Mesh(new THREE.SphereGeometry(rad, 32, 24), mat); c.position.copy(v(x, y)); return c; });
const sphere = (mat, r = 62 * U) => { const d = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 32), mat); d.scale.set(1, 1.1, 1); return d; };
let mx = 0, my = 0, sx = 0, sy = 0; addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
const fit = () => { const w = host.clientWidth, h = host.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; const f = w < 700 ? .52 : .30; camera.position.z = (524 * U / f) / (2 * Math.tan(camera.fov * Math.PI / 360) * camera.aspect); camera.position.y = .08; camera.updateProjectionMatrix(); };
fit(); addEventListener('resize', fit);
const svgHost = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); // para la opción 2D
svgHost.setAttribute('viewBox', '-300 -230 1200 1000'); svgHost.style.display = 'none'; host.appendChild(svgHost);

/* ---------- opciones: cada una devuelve { update(t), dispose() } ---------- */
const root = new THREE.Group(); scene.add(root);
const clear = () => { cur?.dispose?.(); root.clear(); svgHost.style.display = 'none'; svgHost.innerHTML = ''; renderer.domElement.style.display = ''; };
const sway = (g, t, k = 1) => { g.rotation.y = Math.sin(t * .62) * .62 * k + sx * .5; g.rotation.x = Math.sin(t * .81) * .14 * k + sy * .35; g.rotation.z = Math.sin(t * .47) * .07 * k; };

const OPS = {
  orbita() { const m = gloss(), e = new THREE.Group(); e.add(tube(m), ...caps(m)); root.add(e);
    const dot = sphere(m), orbit = new THREE.Group(); orbit.rotation.x = .55; orbit.rotation.z = -.25; orbit.add(dot); root.add(orbit);
    return { update(t) { sway(e, t); e.position.y = .08 + Math.sin(t * 1.1) * .04; orbit.position.copy(e.position); orbit.rotation.y = sx * .5; const a = t * .9; dot.position.set(Math.cos(a) * 1.15, 0, Math.sin(a) * 1.15); } }; },

  escribe() { const m = gloss(), e = new THREE.Group(); const tb = tube(m, 300); e.add(tb); const start = caps(m)[0]; e.add(start);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(R, 32, 24), m); e.add(tip); const dot = sphere(m); e.add(dot); root.add(e);
    const perSeg = 36 * 6, total = 300 * perSeg; // índices por segmento del tubo
    return { update(t) { sway(e, t, .6); e.position.y = .08;
      const T = 7.5, c = (t % T); let p; // ciclo: 0-2.6 se escribe · 2.6-3.2 cae el punto · hasta 6.4 queda · 6.4-7.5 se borra
      if (c < 2.6) p = 1 - Math.pow(1 - c / 2.6, 3); else if (c < 6.4) p = 1; else p = 1 - Math.pow((c - 6.4) / 1.1, 2);
      tb.geometry.setDrawRange(0, Math.floor(p * 300) * perSeg); tip.position.copy(path.getPointAt(Math.max(.001, p))); start.visible = p > .002;
      const d = Math.min(1, Math.max(0, (c - 2.6) / .6)), bounce = d < 1 ? (1 - Math.pow(1 - d, 2)) : 1, fall = c >= 6.4 ? 1 - Math.pow((c - 6.4) / 1.1, 2) : 1;
      dot.visible = c >= 2.6 && fall > 0; dot.position.set(DOT.x, DOT.y + (1 - bounce) * 2.2, 0); dot.scale.set(fall, 1.1 * fall * (1 + (1 - bounce) * .3), fall); } }; },

  gelatina() { const m = gloss(), e = new THREE.Group(); e.add(tube(m), ...caps(m)); root.add(e); const dot = sphere(m); root.add(dot);
    return { update(t) { const T = 2.4, c = (t % T) / T, boing = Math.sin(c * Math.PI * 4) * Math.exp(-c * 4) * .18; // rebote amortiguado
      e.scale.set(1 - boing * .6, 1 + boing, 1 - boing * .6); e.rotation.y = sx * .5; e.rotation.x = sy * .35; e.rotation.z = Math.sin(t * .9) * .05; e.position.y = -.1;
      const h = Math.abs(Math.sin(t * 2.6)), squash = h < .08 ? 1 - (.08 - h) * 5 : 1; // el punto pica sobre la e
      dot.position.set(.35 + Math.sin(t * .5) * .25, .95 + h * 1.1, 0); dot.scale.set(1 / squash, 1.1 * squash, 1 / squash); } }; },

  giro() { const m = gloss(), g = new THREE.Group(); g.add(tube(m), ...caps(m)); const dot = sphere(m); dot.position.copy(DOT); g.add(dot); g.position.x = -.5; root.add(g);
    return { update(t) { g.rotation.y = t * .55 + sx * .6; g.rotation.x = Math.sin(t * .7) * .16 + sy * .4; g.rotation.z = Math.sin(t * .45) * .06; g.position.y = .08 + Math.sin(t * 1.1) * .04; } }; },

  plastilina() { const m = matte(), e = new THREE.Group(); e.add(tube(m), ...caps(m)); root.add(e); const dot = sphere(m); root.add(dot);
    return { update(t) { e.rotation.set(Math.sin(t * .31) * .5 + sy * .3, Math.sin(t * .23) * .9 + sx * .5, Math.cos(t * .19) * .35); e.position.set(Math.sin(t * .27) * .12, .1 + Math.cos(t * .33) * .12, 0);
      dot.position.set(1.25 + Math.sin(t * .41) * .25, -.55 + Math.cos(t * .37) * .35, Math.sin(t * .29) * .4); dot.rotation.y = t * .4; } }; },

  puntos() { const N = 900, m = gloss(), e = new THREE.Group(); root.add(e);
    const inst = new THREE.InstancedMesh(new THREE.SphereGeometry(8 * U, 10, 8), m, N); e.add(inst);
    const base = [], seed = [], M = new THREE.Matrix4(), tmp = new THREE.Vector3(), nrm = new THREE.Vector3(), fr = path.computeFrenetFrames(200, false);
    for (let i = 0; i < N; i++) { const u = Math.random(), p = path.getPointAt(u), k = Math.min(199, Math.floor(u * 200)), a = Math.random() * Math.PI * 2, rr = R * Math.sqrt(Math.random()) * 1.05;
      nrm.copy(fr.normals[k]).multiplyScalar(Math.cos(a) * rr).addScaledVector(fr.binormals[k], Math.sin(a) * rr); base.push(p.clone().add(nrm)); seed.push(Math.random() * 10); }
    const dot = sphere(m); dot.position.copy(DOT); e.add(dot); e.position.x = -.5;
    const mouse = new THREE.Vector3(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    return { update(t) { sway(e, t, .5); e.position.y = .08;
      ray.setFromCamera(new THREE.Vector2(mx * 2, -my * 2), camera); ray.ray.intersectPlane(plane, mouse); e.worldToLocal(mouse);
      for (let i = 0; i < N; i++) { const b = base[i], s = seed[i]; tmp.set(b.x + Math.sin(t * 1.3 + s) * .012, b.y + Math.cos(t * 1.1 + s * 1.7) * .012, b.z + Math.sin(t * .9 + s * .6) * .012);
        const d = tmp.distanceTo(mouse); if (d < .55) { const push = (.55 - d) / .55; tmp.addScaledVector(tmp.clone().sub(mouse).normalize(), push * .5); }
        M.makeTranslation(tmp.x, tmp.y, tmp.z); inst.setMatrixAt(i, M); } inst.instanceMatrix.needsUpdate = true; } }; },

  respira() { const m = gloss(), e = new THREE.Group(); let tb = tube(m, 160, R); e.add(tb); const c = caps(m); e.add(...c); const dot = sphere(m); dot.position.copy(DOT); e.add(dot); e.position.x = -.5; root.add(e);
    return { update(t) { const k = 1 + Math.sin(t * 1.6) * .32; tb.geometry.dispose(); tb.geometry = new THREE.TubeGeometry(path, 160, R * k, 28, false); c.forEach(s => s.scale.setScalar(k));
      const kd = 1 - Math.sin(t * 1.6) * .25; dot.scale.set(kd, 1.1 * kd, kd); sway(e, t, .7); e.position.y = .08; } }; },

  pileta() { const N = 190, m = gloss(), e = new THREE.Group(); root.add(e);
    // una e chica (tubo + tapas + punto) fusionada en una sola geometría, repetida N veces
    const parts = [new THREE.TubeGeometry(path, 70, R, 14, false)];
    for (const [x, y] of [P[0], P[P.length - 1]]) { const g = new THREE.SphereGeometry(R, 14, 10); const q = v(x, y); g.translate(q.x, q.y, 0); parts.push(g); }
    const pg = new THREE.SphereGeometry(62 * U, 16, 12); pg.scale(1, 1.1, 1); pg.translate(DOT.x, DOT.y, 0); parts.push(pg);
    const geo = mergeGeometries(parts); geo.translate(-.4, 0, 0); // centrada con el punto incluido
    const inst = new THREE.InstancedMesh(geo, m, N); e.add(inst);
    const vis = () => { const h = 2 * camera.position.z * Math.tan(camera.fov * Math.PI / 360); return [h * camera.aspect, h]; }; // ancho y alto visibles en z=0
    const es = []; { const [W, H] = vis(); for (let i = 0; i < N; i++) es.push({ x: (Math.random() - .5) * W, y: (Math.random() - .5) * H, vx: 0, vy: 0, r: Math.random() * Math.PI * 2, vr: 0, s: .06 + Math.random() * .085, tx: (Math.random() - .5) * .5, ty: (Math.random() - .5) * .5, seed: Math.random() * 10 }); }
    const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(), S = new THREE.Vector3(), Pv = new THREE.Vector3(), mouse = new THREE.Vector3(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let last = performance.now();
    return { update(t) { const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now; const [W, H] = vis();
      ray.setFromCamera(new THREE.Vector2(mx * 2, -my * 2), camera); ray.ray.intersectPlane(plane, mouse);
      es.forEach((o, i) => {
        // deriva suave, como flotando; el mouse las empuja y las hace girar
        o.vx += Math.sin(t * .4 + o.seed) * .06 * dt; o.vy += Math.cos(t * .35 + o.seed * 1.3) * .06 * dt;
        const dx = o.x - mouse.x, dy = o.y - mouse.y, d = Math.hypot(dx, dy); if (d < 1.1 && d > .001) { const k = (1.1 - d) / 1.1 * 3.2 * dt; o.vx += dx / d * k; o.vy += dy / d * k; o.vr += (dx > 0 ? 1 : -1) * k * 2; }
        // las es se apartan un poco entre sí
        for (let j = i + 1; j < N; j++) { const q = es[j], ex = o.x - q.x, ey = o.y - q.y, dd = Math.hypot(ex, ey), min = (o.s + q.s) * 1.9; if (dd < min && dd > .001) { const k = (min - dd) / min * .6 * dt; o.vx += ex / dd * k; o.vy += ey / dd * k; q.vx -= ex / dd * k; q.vy -= ey / dd * k; } }

  /* ---- J · tinta viva: simulación de fluido en la GPU. La e se "escribe" en tinta roja todo el tiempo y el mouse la revuelve ---- */
  fluido() { renderer.domElement.style.display = 'none';
    const cv = document.createElement('canvas'); cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block'; host.appendChild(cv);
    const gl = cv.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: false });
    if (!gl || !gl.getExtension('EXT_color_buffer_float')) { cv.remove(); renderer.domElement.style.display = ''; return OPS.tinta(); }
    gl.getExtension('OES_texture_float_linear');
    const VS = `#version 300 es
      in vec2 a; out vec2 vUv; out vec2 vL, vR, vT, vB; uniform vec2 texel;
      void main(){ vUv = a * .5 + .5; vL = vUv - vec2(texel.x, 0.); vR = vUv + vec2(texel.x, 0.); vT = vUv + vec2(0., texel.y); vB = vUv - vec2(0., texel.y); gl_Position = vec4(a, 0., 1.); }`;

      precision highp float; precision highp sampler2D; in vec2 vUv, vL, vR, vT, vB; out vec4 o; ${head} void main(){ ${body} }`;
    const SH = {
      splat: F(`vec2 p = vUv - point; p.x *= aspect; vec3 s = exp(-dot(p, p) / radius) * color; vec3 b = texture(uTarget, vUv).xyz; o = vec4(b + s, 1.);`, 'uniform sampler2D uTarget; uniform float aspect, radius; uniform vec2 point; uniform vec3 color;'),
      advect: F(`vec2 c = vUv - dt * texture(uVelocity, vUv).xy * texelSize; o = dissipation * texture(uSource, c);`, 'uniform sampler2D uVelocity, uSource; uniform vec2 texelSize; uniform float dt, dissipation;'),
      div: F(`float L = texture(uVelocity, vL).x, R = texture(uVelocity, vR).x, T = texture(uVelocity, vT).y, B = texture(uVelocity, vB).y; vec2 C = texture(uVelocity, vUv).xy;
        if (vL.x < 0.) L = -C.x; if (vR.x > 1.) R = -C.x; if (vT.y > 1.) T = -C.y; if (vB.y < 0.) B = -C.y; o = vec4(.5 * (R - L + T - B), 0., 0., 1.);`, 'uniform sampler2D uVelocity;'),
      curl: F(`float L = texture(uVelocity, vL).y, R = texture(uVelocity, vR).y, T = texture(uVelocity, vT).x, B = texture(uVelocity, vB).x; o = vec4(.5 * (R - L - T + B), 0., 0., 1.);`, 'uniform sampler2D uVelocity;'),
      vort: F(`float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x, T = texture(uCurl, vT).x, B = texture(uCurl, vB).x, C = texture(uCurl, vUv).x;
        vec2 f = .5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); f /= length(f) + 1e-4; f *= curl * C; f.y *= -1.; vec2 v = texture(uVelocity, vUv).xy + f * dt; o = vec4(clamp(v, -1000., 1000.), 0., 1.);`, 'uniform sampler2D uVelocity, uCurl; uniform float curl, dt;'),
      press: F(`float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x, T = texture(uPressure, vT).x, B = texture(uPressure, vB).x, d = texture(uDivergence, vUv).x; o = vec4((L + R + B + T - d) * .25, 0., 0., 1.);`, 'uniform sampler2D uPressure, uDivergence;'),
      grad: F(`float L = texture(uPressure, vL).x, R = texture(uPressure, vR).x, T = texture(uPressure, vT).x, B = texture(uPressure, vB).x; vec2 v = texture(uVelocity, vUv).xy - vec2(R - L, T - B); o = vec4(v, 0., 1.);`, 'uniform sampler2D uPressure, uVelocity;'),
      clear: F(`o = value * texture(uTexture, vUv);`, 'uniform sampler2D uTexture; uniform float value;'),
      show: F(`vec3 c = texture(uTexture, vUv).rgb; float mx = max(c.r, max(c.g, c.b)); float a = clamp(mx * 1.6, 0., 1.); vec3 col = c / max(mx, 1e-3); o = vec4(mix(col, c, .35), a);`, 'uniform sampler2D uTexture;'),
    };
    const prog = (fs) => { const p = gl.createProgram(); for (const [t, src] of [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]]) { const sh = gl.createShader(t); gl.shaderSource(sh, src); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); } gl.linkProgram(p);
      const u = {}; for (let i = 0; i < gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i++) { const n = gl.getActiveUniform(p, i).name; u[n] = gl.getUniformLocation(p, n); } return { p, u }; };
    const PR = {}; for (const k in SH) PR[k] = prog(SH[k]);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const fbo = (w, h, fmt, ifmt, type) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null); const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      return { t, f, w, h, texel: [1 / w, 1 / h], bind(i) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, t); return i; } }; };
    const dfbo = (w, h, fmt, ifmt, type) => { let a = fbo(w, h, fmt, ifmt, type), b = fbo(w, h, fmt, ifmt, type); return { get r() { return a; }, get w() { return b; }, texel: a.texel, swap() { [a, b] = [b, a]; } }; };
    let W, H, vel, dye, div, curlT, pres;
    const size = () => { const ar = host.clientWidth / host.clientHeight; W = cv.width = Math.round(host.clientWidth * .75); H = cv.height = Math.round(host.clientHeight * .75);
      const sw = Math.round(ar >= 1 ? 160 * ar : 160), sh = Math.round(ar >= 1 ? 160 : 160 / ar), dw = Math.round(ar >= 1 ? 640 * ar : 640), dh = Math.round(ar >= 1 ? 640 : 640 / ar);
      vel = dfbo(sw, sh, gl.RG, gl.RG16F, gl.HALF_FLOAT); dye = dfbo(dw, dh, gl.RGBA, gl.RGBA16F, gl.HALF_FLOAT); div = fbo(sw, sh, gl.RED, gl.R16F, gl.HALF_FLOAT); curlT = fbo(sw, sh, gl.RED, gl.R16F, gl.HALF_FLOAT); pres = dfbo(sw, sh, gl.RED, gl.R16F, gl.HALF_FLOAT); };
    size(); addEventListener('resize', size);
    const use = (P, target) => { gl.useProgram(P.p); gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null); gl.viewport(0, 0, target ? target.w : W, target ? target.h : H); return P.u; };
    const draw = () => gl.drawArrays(gl.TRIANGLES, 0, 3);
    const aspect = () => W / H;
    const splat = (x, y, dx, dy, color, rad) => { // x,y en 0..1 (y hacia arriba)
      let u = use(PR.splat, vel.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uTarget, vel.r.bind(0)); gl.uniform1f(u.aspect, aspect()); gl.uniform2f(u.point, x, y); gl.uniform3f(u.color, dx, dy, 0); gl.uniform1f(u.radius, rad); draw(); vel.swap();
      u = use(PR.splat, dye.w); gl.uniform2fv(u.texel, dye.texel); gl.uniform1i(u.uTarget, dye.r.bind(0)); gl.uniform1f(u.aspect, aspect()); gl.uniform2f(u.point, x, y); gl.uniform3fv(u.color, color); gl.uniform1f(u.radius, rad); draw(); dye.swap(); };
    // la e, en coordenadas 0..1 del canvas: centrada, 62% del alto (la e mide 2.0067 unidades de alto)
    const E = (u) => { const q = path.getPointAt(u); return [.5 + q.x * .62 / 2.0067 / aspect(), .5 + q.y * .62 / 2.0067]; };
    let lm = null, last = performance.now(), ft = 0; // ft: reloj propio, avanza con dt (si un cuadro tarda, la lapicera no salta)
    const pointer = (e) => { const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height; if (lm) { const dx = (x - lm[0]) * 9000, dy = (y - lm[1]) * 9000; if (Math.abs(dx) + Math.abs(dy) > 0) splat(x, y, dx, dy, [.045, .05, 0], .0009); } lm = [x, y]; };
    addEventListener('pointermove', pointer, { passive: true }); const leave = () => lm = null; addEventListener('pointerleave', leave);
    const pens = [0, 1 / 6, 2 / 6, 3 / 6, 4 / 6, 5 / 6];
    return { update() { const now = performance.now(), dt = Math.min(.033, (now - last) / 1000); last = now; ft += dt; const t = ft;
      // la e se escribe: 4 "lapiceras" recorren el trazo sin parar, soltando tinta roja con un empujoncito hacia adelante
      const steps = 2; // si el cuadro tardó mucho, la lapicera igual deja trazo continuo
      pens.forEach((o) => { for (let k = 0; k < steps; k++) { const u = ((t - dt * (1 - k / steps)) * .2 + o + 1) % 1, [x, y] = E(u), [x2, y2] = E(Math.min(1, u + .004)); splat(x, y, (x2 - x) * 260, (y2 - y) * 260, [.36, .011, .03], .00016); } });
      if (Math.floor(t * .5) % 2 === 0) splat(.5 + DOT.x * .62 / 2.0067 / aspect(), .5 + DOT.y * .62 / 2.0067, 0, 0, [.25, .008, .02], .0002); // el punto, a pulsos
      let u = use(PR.curl, curlT); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uVelocity, vel.r.bind(0)); draw();
      u = use(PR.vort, vel.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uVelocity, vel.r.bind(0)); gl.uniform1i(u.uCurl, curlT.bind(1)); gl.uniform1f(u.curl, 22); gl.uniform1f(u.dt, dt); draw(); vel.swap();
      u = use(PR.div, div); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uVelocity, vel.r.bind(0)); draw();
      u = use(PR.clear, pres.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uTexture, pres.r.bind(0)); gl.uniform1f(u.value, .8); draw(); pres.swap();
      for (let i = 0; i < 18; i++) { u = use(PR.press, pres.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uDivergence, div.bind(0)); gl.uniform1i(u.uPressure, pres.r.bind(1)); draw(); pres.swap(); }
      u = use(PR.grad, vel.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform1i(u.uPressure, pres.r.bind(0)); gl.uniform1i(u.uVelocity, vel.r.bind(1)); draw(); vel.swap();
      u = use(PR.advect, vel.w); gl.uniform2fv(u.texel, vel.texel); gl.uniform2fv(u.texelSize, vel.texel); gl.uniform1i(u.uVelocity, vel.r.bind(0)); gl.uniform1i(u.uSource, vel.r.bind(0)); gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, .99); draw(); vel.swap();
      u = use(PR.advect, dye.w); gl.uniform2fv(u.texel, dye.texel); gl.uniform2fv(u.texelSize, vel.texel); gl.uniform1i(u.uVelocity, vel.r.bind(0)); gl.uniform1i(u.uSource, dye.r.bind(1)); gl.uniform1f(u.dt, dt); gl.uniform1f(u.dissipation, .994); draw(); dye.swap();
      u = use(PR.show, null); gl.uniform2fv(u.texel, dye.texel); gl.uniform1i(u.uTexture, dye.r.bind(0)); draw(); },
      dispose() { removeEventListener('pointermove', pointer); removeEventListener('pointerleave', leave); removeEventListener('resize', size); cv.remove(); } }; },

  /* ---- K · ventana: la e es un recorte por el que pasa el contenido de la agencia ---- */
  ventana() { renderer.domElement.style.display = 'none';
    const A = '../assets/servicios', items = ['fotografia/gpt-2.jpg', 'contenido/unboxing', 'community/img-4817.jpg', 'fotografia/dsc07842.jpg', 'ugc/tezza-9126', 'ia/gpt-3.jpg', 'fotografia/tezza-vintage.jpg', 'eventos/recap-evento-2', 'branding/pricobowls.jpg', 'ia/cuadro1.jpg'];
    const it = (f) => f.includes('.') ? `<img src="${A}/${f}" alt="">` : `<video src="${A}/${f}.mp4" poster="${A}/${f}.jpg" muted loop playsinline autoplay></video>`;
    const el = document.createElement('div'); el.className = 'ventana'; el.innerHTML = `<div class="ventana__e"><div class="ventana__in">${items.map(it).join('')}${items.map(it).join('')}</div></div><div class="ventana__dot"></div>`; host.appendChild(el);
    const e = el.querySelector('.ventana__e'), inner = el.querySelector('.ventana__in');
    return { update(t) { e.style.transform = `translate(-50%, -50%) perspective(900px) rotateY(${sx * 18}deg) rotateX(${-sy * 12}deg) rotate(${Math.sin(t * .6) * 1.5}deg)`; inner.style.marginLeft = `${sx * -60}px`; }, dispose() { el.remove(); } }; },

  /* ---- L · feed 3D: una pared curva de trabajos (fotos y posters de reels) girando despacio detrás de la e brillante ---- */
  feed() { const m = gloss(), e = new THREE.Group(); e.add(tube(m), ...caps(m)); const dot = sphere(m); dot.position.copy(DOT); e.add(dot); e.scale.setScalar(.72); e.position.set(-.3, .05, .6); root.add(e);
    const A = '../assets/servicios/', files = ['fotografia/gpt-2.jpg', 'contenido/unboxing.jpg', 'community/img-4817.jpg', 'fotografia/dsc07842.jpg', 'branding/cabra-01.jpg', 'ugc/tezza-9126.jpg', 'ia/gpt-3.jpg', 'fotografia/tezza-vintage.jpg', 'community/img-4818.jpg', 'eventos/recap-evento-2.jpg', 'fotografia/gpt-1.jpg', 'ia/cuadro1.jpg', 'contenido/nov-5.jpg', 'ugc/video-5.jpg', 'community/mba-despues.jpg', 'ia/wa-1.jpg', 'fotografia/gpt-3.jpg', 'produccion/wa-3.jpg', 'branding/pricobowls.jpg', 'contenido/captions.jpg'];
    const loader = new THREE.TextureLoader(), wall = new THREE.Group(); root.add(wall);
    const COLS = 18, ROWS = 5, RAD = 5.2, GEO = new THREE.PlaneGeometry(.88, 1.1); // 4:5
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const tex = loader.load(A + files[(r * 5 + c) % files.length]); tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(GEO, new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: .96 })); const a = (c / COLS) * Math.PI * 2 + (r % 2) * .22;
      mesh.position.set(Math.sin(a) * RAD, (r - (ROWS - 1) / 2) * 1.25, Math.cos(a) * RAD); mesh.lookAt(0, mesh.position.y, 0); mesh.userData = { a, r }; wall.add(mesh); }
    wall.position.y = -.1;
    return { update(t) { wall.rotation.y = t * .06 + sx * .35; wall.rotation.x = sy * .08; wall.children.forEach((mh, i) => mh.position.y = (mh.userData.r - (ROWS - 1) / 2) * 1.25 + Math.sin(t * .8 + i) * .04);
      sway(e, t, .5); e.position.y = .05 + Math.sin(t * 1.1) * .04; } }; },

  tinta() { renderer.domElement.style.display = 'none'; svgHost.style.display = 'block';
    svgHost.innerHTML = `<g transform="translate(-40 -60)"><path id="tr" d="M 118 415 C 180 330, 280 205, 350 135 C 405 80, 365 12, 250 20 C 130 35, 40 140, 28 260 C 18 380, 40 500, 120 565 C 210 600, 330 520, 430 420 C 470 380, 495 345, 502 328" fill="none" stroke="#e30613" stroke-width="135" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="ds"></g><g id="pt" transform="translate(706 491)"><ellipse rx="63" ry="70" fill="#e30613" transform="rotate(20)"/></g></g>`;
    const tr = svgHost.querySelector('#tr'), pt = svgHost.querySelector('#pt'), ds = svgHost.querySelector('#ds'), L = tr.getTotalLength(); tr.style.strokeDasharray = L;
    let drops = [], lastSplash = -1;
    return { update(t) { const T = 6.5, c = t % T; let p; // 0-2.2 se escribe · 2.2 cae el punto y salpica · 5.6 se borra
      if (c < 2.2) p = 1 - Math.pow(1 - c / 2.2, 2.4); else if (c < 5.6) p = 1; else p = 1 - Math.pow((c - 5.6) / .9, 2);
      tr.style.strokeDashoffset = L * (1 - p); tr.style.opacity = c >= 5.6 ? Math.max(0, 1 - (c - 5.6) / .9) : 1;
      const d = Math.min(1, Math.max(0, (c - 2.2) / .5)), b = 1 - Math.pow(1 - d, 3);
      pt.setAttribute('transform', `translate(706 ${491 - (1 - b) * 500}) scale(${c >= 2.2 && c < 5.6 ? b : (c >= 5.6 ? Math.max(0, 1 - (c - 5.6) / .9) : 0)})`);
      const cycle = Math.floor(t / T); if (d >= 1 && lastSplash !== cycle) { lastSplash = cycle; drops = []; for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9; drops.push({ x: 706, y: 491, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, r: 4 + Math.random() * 10, life: 1 }); } }
      for (const q of drops) { q.x += q.vx; q.y += q.vy; q.vy += .5; q.life -= .022; } drops = drops.filter(q => q.life > 0);
      ds.innerHTML = drops.map(q => `<circle cx="${q.x}" cy="${q.y}" r="${q.r * q.life}" fill="#e30613" opacity="${q.life}"/>`).join('');
      svgHost.style.transform = `rotate(${Math.sin(t * .8) * 1.5}deg) translateY(${Math.sin(t * 1.1) * 6}px)`; } }; },
};

/* ---------- selector ---------- */
let cur = null, curName = null;
const pick = (name) => { clear(); curName = name; cur = OPS[name](); document.querySelectorAll('.op').forEach(b => b.classList.toggle('on', b.dataset.op === name)); history.replaceState(null, '', '#' + name); };
document.querySelectorAll('.op').forEach(b => b.addEventListener('click', () => pick(b.dataset.op)));
pick(OPS[location.hash.slice(1)] ? location.hash.slice(1) : 'orbita');
const t0 = performance.now();
const tick = () => { const t = (performance.now() - t0) / 1000; sx += (mx - sx) * .05; sy += (my - sy) * .05; cur.update(t); if (!['tinta', 'fluido', 'ventana'].includes(curName)) renderer.render(scene, camera); requestAnimationFrame(tick); };
tick();
